
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Grand African Plate Hotel | Login</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Segoe UI", Tahoma, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 25px;
            background:
                radial-gradient(circle at top left, #302719, transparent 40%),
                radial-gradient(circle at bottom right, #29231A, transparent 40%),
                #111318;
            color: #F3F0E8;
        }

        .login-container {
            width: 100%;
            max-width: 430px;
        }

        .login-box {
            background: linear-gradient(145deg, #242A34, #191D25);
            border: 1px solid rgba(214,184,120,0.35);
            border-top: 4px solid #D6B878;
            border-radius: 18px;
            padding: 42px 38px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        }

        .brand {
            text-align: center;
            margin-bottom: 35px;
        }

        .brand-logo {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(145deg, #45371F, #201C15);
            border: 1px solid #D6B878;
            border-radius: 20px;
            color: #F0D99F;
            font-size: 30px;
            box-shadow: 0 0 30px rgba(214,184,120,0.15);
        }

        .brand h1 {
            color: #F0D99F;
            font-size: 20px;
            letter-spacing: 2px;
            margin-bottom: 7px;
        }

        .brand span {
            color: #D6B878;
            font-size: 11px;
            letter-spacing: 4px;
            font-weight: 600;
        }

        .brand-divider {
            width: 65%;
            height: 1px;
            margin: 20px auto;
            background: linear-gradient(
                90deg,
                transparent,
                #D6B878,
                transparent
            );
        }

        .login-heading {
            text-align: center;
            margin-bottom: 30px;
        }

        .login-heading h2 {
            font-size: 22px;
            color: #F3F0E8;
            margin-bottom: 8px;
        }

        .login-heading p {
            color: #A0A5AF;
            font-size: 13px;
        }

        .form-group {
            margin-bottom: 22px;
        }

        label {
            display: block;
            color: #D6B878;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 9px;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #D6B878;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 43px;
            background: #171A21;
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 9px;
            color: #F3F0E8;
            font-size: 14px;
            outline: none;
            transition: 0.25s ease;
        }

        input:focus {
            border-color: #D6B878;
            box-shadow: 0 0 0 3px rgba(214,184,120,0.12);
        }

        input::placeholder {
            color: #777E89;
        }

        .login-button {
            width: 100%;
            padding: 15px;
            margin-top: 8px;
            background: linear-gradient(135deg, #D6B878, #F0D99F);
            border: none;
            border-radius: 9px;
            color: #171717;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.25s ease;
        }

        .login-button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 22px rgba(214,184,120,0.22);
        }

        .login-button i {
            margin-left: 8px;
        }

        .security-note {
            text-align: center;
            margin-top: 27px;
            color: #858B96;
            font-size: 11px;
        }

        .security-note i {
            color: #D6B878;
            margin-right: 5px;
        }

        .footer {
            text-align: center;
            margin-top: 22px;
            color: #777E89;
            font-size: 10px;
            letter-spacing: 1px;
        }

        @media(max-width: 480px) {
            .login-box {
                padding: 35px 24px;
            }

            .brand h1 {
                font-size: 17px;
            }
        }

    </style>

</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <!-- HOTEL BRANDING -->
            <div class="brand">

                <div class="brand-logo">
                    <i class="fa-solid fa-utensils"></i>
                </div>

                <h1>GRAND AFRICAN</h1>
                <span>PLATE HOTEL</span>

                <div class="brand-divider"></div>

            </div>

            <!-- LOGIN HEADING -->
            <div class="login-heading">

                <h2>Welcome Back</h2>

                <p>Sign in to access your management dashboard</p>

            </div>

            <!-- LOGIN FORM -->
            <form method="POST">

                <div class="form-group">

                    <label for="username">Username</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-user"></i>

                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >

                    </div>

                </div>

                <div class="form-group">

                    <label for="password">Password</label>

                    <div class="input-wrapper">

                        <i class="fa-solid fa-lock"></i>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >

                    </div>

                </div>

                <button type="submit" class="login-button">
                    Sign In
                    <i class="fa-solid fa-arrow-right"></i>
                </button>

            </form>

            <div class="security-note">
                <i class="fa-solid fa-shield-halved"></i>
                Secure Staff Access
            </div>

        </div>

        <div class="footer">
            GRAND AFRICAN PLATE HOTEL &copy; 2026
        </div>

    </div>

</body>
</html>
